
all:
  vars:
    clab_lab_name: projet10-ipv6
    ansible_connection: community.docker.docker
    ansible_python_interpreter: /usr/bin/python3
    ansible_remote_tmp: /tmp/.ansible-tmp

  children:

    routeurs:
      hosts:
        routeur:
          ansible_host: "clab-{{ clab_lab_name }}-routeur"
          lan_prefix: "2001:db8:10:1::/64"
          router_addr: "2001:db8:10:1::1"
          lan_iface: eth1

    serveurs_dhcp6:
      hosts:
        dhcp6:
          ansible_host: "clab-{{ clab_lab_name }}-dhcp6"
          lan_iface: eth1

    hotes:
      hosts:
        hote-a:
          ansible_host: "clab-{{ clab_lab_name }}-hote-a"
          lan_iface: eth1

        hote-b:
          ansible_host: "clab-{{ clab_lab_name }}-hote-b"
          lan_iface: eth1

    firewall_host:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

          bridge_name: bridge-lan

          trusted_router_iface: x1
          trusted_dhcp6_iface: x2

          client_a_iface: x3
          client_b_iface: x4

          attacker_iface: x5
