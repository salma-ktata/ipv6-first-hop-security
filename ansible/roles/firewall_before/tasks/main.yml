
- name: Remove project firewall table
  command: nft delete table bridge ipv6_fhs
  register: delete_project_table
  failed_when: false
  changed_when: delete_project_table.rc == 0

- name: Confirm that project firewall table is absent
  command: nft list table bridge ipv6_fhs
  register: firewall_check
  failed_when: false
  changed_when: false

- name: Verify vulnerable baseline
  assert:
    that:
      - firewall_check.rc != 0
    fail_msg: "The project's firewall table is still active."
