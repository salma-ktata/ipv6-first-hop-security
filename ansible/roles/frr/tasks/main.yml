- name: Installer FRRouting (Alpine)
  community.general.apk:
    name: frr
    state: present
    update_cache: true

- name: Déployer frr.conf
  template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"

- name: Vérifier si zebra tourne déjà
  command: pgrep zebra
  register: zebra_running
  failed_when: false
  changed_when: false

- name: Démarrer zebra directement si pas encore lancé
  command: /usr/lib/frr/zebra -d -F traditional -A 127.0.0.1 -s 90000000
  when: zebra_running.rc != 0

- name: Recharger la config sans redémarrer les daemons
  command: python3 /usr/lib/frr/frr-reload.py --reload --stdout /etc/frr/frr.conf
  when: zebra_running.rc == 0
