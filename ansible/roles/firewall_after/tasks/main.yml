- name: Installer nftables
  apt:
    name: nftables
    state: present
    update_cache: true

- name: Déployer after.nft (RA Guard / DHCPv6 Guard / filtrage ND)
  template:
    src: after.nft.j2
    dest: /etc/nftables.d/after.nft
    mode: "0644"

- name: Déployer anti_bypass.nft
  copy:
    src: ../../../firewall/anti_bypass.nft
    dest: /etc/nftables.d/anti_bypass.nft
    mode: "0644"

- name: Charger after.nft
  command: nft -f /etc/nftables.d/after.nft
  changed_when: true

- name: Charger anti_bypass.nft
  command: nft -f /etc/nftables.d/anti_bypass.nft
  changed_when: true

- name: Vérifier que les règles sont bien chargées
  command: nft list table bridge filter
  register: nft_check
  changed_when: false

- name: Afficher le ruleset chargé
  debug:
    var: nft_check.stdout_lines
