- name: Installer radvd (Alpine)
  community.general.apk:
    name: radvd
    state: present
    update_cache: true

- name: Créer le dossier pour le PID de radvd
  file:
    path: /run/radvd
    state: directory

- name: Déployer la configuration radvd
  template:
    src: radvd.conf.j2
    dest: /etc/radvd.conf
    owner: root
    mode: "0644"

- name: Activer le transfert IPv6
  sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true

- name: Vérifier si radvd tourne déjà
  command: pgrep radvd
  register: radvd_running
  failed_when: false
  changed_when: false

- name: Démarrer radvd (pas de systemd dans ce conteneur)
  command: radvd -C /etc/radvd.conf
  when: radvd_running.rc != 0
