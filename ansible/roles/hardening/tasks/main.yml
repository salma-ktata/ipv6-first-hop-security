
- name: Enable temporary IPv6 addresses
  sysctl:
    name: "net.ipv6.conf.{{ lan_iface }}.use_tempaddr"
    value: "2"
    sysctl_set: true
    reload: true


- name: Enable stable privacy address generation
  sysctl:
    name: "net.ipv6.conf.{{ lan_iface }}.addr_gen_mode"
    value: "3"
    sysctl_set: true
    reload: true


- name: Drop unsolicited Neighbor Advertisements
  sysctl:
    name: "net.ipv6.conf.{{ lan_iface }}.drop_unsolicited_na"
    value: "1"
    sysctl_set: true
    reload: true
