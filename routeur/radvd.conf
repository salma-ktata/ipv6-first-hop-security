interface eth1 {
    AdvSendAdvert on;
    MinRtrAdvInterval 30;
    MaxRtrAdvInterval 100;
    AdvManagedFlag off; # off = SLAAC, on = DHCPv6 stateful
    AdvOtherConfigFlag on; # options DNS via DHCPv6
    prefix 2001:db8:10:1::/64 {
        AdvOnLink on;
        AdvAutonomous on;
        AdvValidLifetime 86400;
        AdvPreferredLifetime 14400;
    };
};
